name: Sideload Build (unsigned)

# Manual only: builds an UNSIGNED .ipa for a real iPhone (arm64), with no
# Apple Developer account involved in CI at all. Sign it yourself afterwards
# with a free Apple ID using a tool like Sideloadly (sideloadly.io) on any
# desktop OS — Sideloadly performs the personal-team signing that Xcode would
# normally do, so no Mac is required to get the app onto a device.
#
# Free-account installs expire after 7 days; re-run Sideloadly against the
# same .ipa to re-sign and reinstall.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned .ipa
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      # No provisioning profile, no signing identity — just the arm64 binary
      # and resources. Sideloadly (or any ad-hoc resigning tool) re-signs this
      # from scratch, so nothing here needs to be valid for on-device launch.
      #
      # `archive` (not `build`) is required: the RemoteCam scheme's app target
      # implicitly embeds RemoteShutterWatch, and a plain `build` action of the
      # combined graph lets Xcode's dependency resolution pull in both the iOS
      # and watchOS variants of the VideocallCodecs pod at once, which collide
      # writing to the same derived-data path ("duplicate output file ...
      # VideocallCodecs.framework ... in target 'VideocallCodecs-watchOS'") and
      # fail the build outright. `ios-ci.yml`'s own "Archive for Release" step
      # builds this identical scheme (embedded Watch app included) unsigned via
      # `archive` without hitting this — the archive action's per-platform
      # product layout doesn't collide the way a plain build's shared derived
      # data does.
      - name: Archive RemoteShutter for iOS device (unsigned)
        run: |
          xcodebuild \
            -workspace RemoteShutter.xcworkspace \
            -scheme RemoteCam \
            -configuration Release \
            -archivePath build/RemoteShutter.xcarchive \
            archive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      # Sideloading tools expect the standard IPA shape: a zip containing a
      # top-level Payload/ folder with the .app bundle inside it. The product
      # is named RemoteShutter.app (the scheme is named RemoteCam, the target
      # is not). An unsigned archive's .app lives directly under
      # Products/Applications — no -exportArchive (which needs real signing)
      # required.
      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/RemoteShutter.xcarchive/Products/Applications/RemoteShutter.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "RemoteShutter.app not found at $APP_PATH" >&2
            find build/RemoteShutter.xcarchive/Products -maxdepth 3
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r RemoteCam-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCam-unsigned-ipa
          path: RemoteCam-unsigned.ipa
          retention-days: 14
