name: Sideload Build (unsigned)

# Manual only: builds an UNSIGNED .ipa for a real iPhone (arm64), with no
# Apple Developer account involved in CI at all. Sign it yourself afterwards
# with a free Apple ID using a tool like Sideloadly (sideloadly.io) on any
# desktop OS — Sideloadly performs the personal-team signing that Xcode would
# normally do, so no Mac is required to get the app onto a device.
#
# Free-account installs expire after 7 days; re-run Sideloadly against the
# same .ipa to re-sign and reinstall.
#
# The Apple Watch companion is deliberately NOT part of this build — see the
# "Detach Watch companion" step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned .ipa
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      # The RemoteShutter app target explicitly depends on, and embeds,
      # RemoteShutterWatch. That pulls the watchOS variant of the vendored
      # VideocallCodecs xcframework pod into the same build as the iOS variant,
      # and both pod targets' "[CP] Copy XCFrameworks" script phases declare
      # the identical output path (confirmed in
      # Pods/Target Support Files/VideocallCodecs-{iOS,watchOS}/
      # *-xcframeworks-output-files.xcfilelist — both are literally
      # "${PODS_XCFRAMEWORKS_BUILD_DIR}/VideocallCodecs/VideocallCodecs.framework",
      # and both resolve under Products/<Config>-iphoneos). Xcode rejects the
      # build plan outright:
      #
      #   error: Multiple commands produce '.../Debug-iphoneos/
      #   XCFrameworkIntermediates/VideocallCodecs/VideocallCodecs.framework'
      #
      # A sideloaded phone build needs none of the Watch companion, so drop it
      # from the graph rather than fighting the pod collision. Only the two
      # array *references* are removed (they end in "*/,"); the object
      # definitions stay behind, orphaned, which Xcode tolerates. This edits
      # the ephemeral CI checkout only — nothing is committed.
      - name: Detach Watch companion from the build graph
        run: |
          set -euo pipefail
          PROJ=RemoteShutter.xcodeproj/project.pbxproj

          embed='^[[:space:]]*66535847B5B066B3E542804A /\* Embed Watch Content \*/,$'
          dep='^[[:space:]]*F9BE2447CA8A8A4E4BC91CD6 /\* PBXTargetDependency \*/,$'

          # Fail loudly rather than silently building with the Watch app still
          # attached if these UUIDs ever change.
          for pattern in "$embed" "$dep"; do
            if ! grep -qE "$pattern" "$PROJ"; then
              echo "::error::Expected pbxproj reference not found ($pattern). The project layout changed — update this step." >&2
              exit 1
            fi
          done

          grep -vE "$embed" "$PROJ" > "$PROJ.tmp" && mv "$PROJ.tmp" "$PROJ"
          grep -vE "$dep"   "$PROJ" > "$PROJ.tmp" && mv "$PROJ.tmp" "$PROJ"
          echo "Watch companion detached from RemoteShutter target."

      # No provisioning profile, no signing identity — just the arm64 binary
      # and resources. Sideloadly (or any ad-hoc resigning tool) re-signs this
      # from scratch, so nothing here needs to be valid for on-device launch.
      - name: Build RemoteShutter for iOS device (unsigned)
        run: |
          xcodebuild \
            -workspace RemoteShutter.xcworkspace \
            -scheme RemoteCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # Sideloading tools expect the standard IPA shape: a zip containing a
      # top-level Payload/ folder with the .app bundle inside it. The product
      # is RemoteShutter.app — "RemoteCam" is the scheme name, not the target.
      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/RemoteShutter.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::RemoteShutter.app not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr RemoteCam-unsigned.ipa Payload
          ls -lh RemoteCam-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCam-unsigned-ipa
          path: RemoteCam-unsigned.ipa
          retention-days: 14
