name: Sideload Build (unsigned)

# Manual only: builds an UNSIGNED .ipa for a real iPhone (arm64), with no
# Apple Developer account involved in CI at all. Sign it yourself afterwards
# with a free Apple ID using a tool like Sideloadly (sideloadly.io) on any
# desktop OS — Sideloadly performs the personal-team signing that Xcode would
# normally do, so no Mac is required to get the app onto a device.
#
# Free-account installs expire after 7 days; re-run Sideloadly against the
# same .ipa to re-sign and reinstall.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned .ipa
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      # No provisioning profile, no signing identity — just the arm64 binary
      # and resources. Sideloadly (or any ad-hoc resigning tool) re-signs this
      # from scratch, so nothing here needs to be valid for on-device launch.
      #
      # The RemoteCam scheme's app target implicitly embeds RemoteShutterWatch,
      # which pulls in the watchOS variant of the vendored VideocallCodecs
      # xcframework pod alongside the iOS variant. Both pod targets' [CP] Copy
      # XCFrameworks script phases are generated with the literal same
      # templated output path (`${PODS_XCFRAMEWORKS_BUILD_DIR}/VideocallCodecs/
      # VideocallCodecs.framework` — checked directly in
      # Pods/Target Support Files/VideocallCodecs-{iOS,watchOS}/
      # *-xcframeworks-output-files.xcfilelist), and something about this
      # project's build-directory setup collapses their per-platform
      # `$(EFFECTIVE_PLATFORM_NAME)` distinction for an iphoneos/device build,
      # so the two collide as a duplicate output and hard-fail the whole build
      # ("CreateBuildDirectory" abort, no clearer diagnostic). Overriding
      # PODS_XCFRAMEWORKS_BUILD_DIR here — appending the platform name
      # explicitly — forces the two pod targets apart regardless of whatever
      # upstream xcconfig chain was collapsing them.
      - name: Archive RemoteShutter for iOS device (unsigned)
        run: |
          xcodebuild \
            -workspace RemoteShutter.xcworkspace \
            -scheme RemoteCam \
            -configuration Release \
            -archivePath build/RemoteShutter.xcarchive \
            archive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            'PODS_XCFRAMEWORKS_BUILD_DIR=$(PODS_CONFIGURATION_BUILD_DIR)/XCFrameworkIntermediates$(EFFECTIVE_PLATFORM_NAME)'

      # Sideloading tools expect the standard IPA shape: a zip containing a
      # top-level Payload/ folder with the .app bundle inside it. The product
      # is named RemoteShutter.app (the scheme is named RemoteCam, the target
      # is not). An unsigned archive's .app lives directly under
      # Products/Applications — no -exportArchive (which needs real signing)
      # required.
      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/RemoteShutter.xcarchive/Products/Applications/RemoteShutter.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "RemoteShutter.app not found at $APP_PATH" >&2
            find build/RemoteShutter.xcarchive/Products -maxdepth 3
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r RemoteCam-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCam-unsigned-ipa
          path: RemoteCam-unsigned.ipa
          retention-days: 14
